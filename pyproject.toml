[project]
name = "gameplan"
version = "0.1.0"
description = "Hitter-specific Go / No-Go game plans and pitch-level decision vs execution scoring"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gameplan = "gameplan.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
gameplan = ["*.json", "viewer/*"]
