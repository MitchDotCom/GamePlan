<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GamePlan Game Viewer</title>
<style>/*__CSS__*/</style></head><body><div class="wrap">
<div class="bar">
<div class="top"><h1 id="title"></h1><div class="tabs noprint" id="views"></div>
<details class="proto"><summary>Prototype</summary><p>Public 2025 MLB data. Each plan is fit only on games before the game date and covers the opposing starter; relievers show without a plan. Not validated for use, not tested at Single-A.</p></details></div>
<div class="tools noprint">
<label class="f">Team <select id="team"></select></label>
<label class="f">Zone view <select id="vside"><option value="catcher">Catcher view</option><option value="batter">Batter-relative</option></select></label>
<label class="f">Runner on third, under 2 outs <select id="pol"><option value="OFF">Count plan</option><option value="CONTACT_FIRST">Contact first</option></select></label>
</div></div>
<div id="main"></div>
</div>
<script>/*__JS__*/</script></body></html>
