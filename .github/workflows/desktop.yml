name: Desktop app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[desktop]" pyinstaller
      - name: Package
        run: pyinstaller --noconfirm --windowed --name GamePlan --collect-all webview --add-data "src/gameplan/viewer${{ runner.os == 'Windows' && ';' || ':' }}gameplan/viewer" --add-data "src/gameplan/field_reference_signs_2025.json${{ runner.os == 'Windows' && ';' || ':' }}gameplan" src/gameplan/desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: GamePlan-${{ matrix.os }}
          path: dist/
